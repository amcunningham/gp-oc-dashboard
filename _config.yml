# GitHub Pages (Jekyll) build settings.
# The site stopped deploying in Nov 2026: the published bundle had grown to ~420MB
# and GitHub's file sync timed out. The files below stay in the repo but are not
# published to the website, because no page loads them. If a page starts loading
# one of them (e.g. explore.html / mypractice.html via DATA_BASE), remove it here.
exclude:
  - "*.zip"
  - "**/*.zip"
  - "*.docx"
  - "*.pptx"
  - continuity-analysis-working-files
  - research/scripts
  - research/pipeline
  - research/worker
  - start_explorer.bat
  # research/data files over 1MB that no page references
  - "research/data/cbt_daytime_mar26.parquet"
